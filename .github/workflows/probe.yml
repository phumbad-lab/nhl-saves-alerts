name: Probe odds feed (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          K = os.environ["ODDS_API_KEY"]
          def get(path, **p):
              p["apiKey"] = K
              u = f"https://api.the-odds-api.com/v4{path}?{urllib.parse.urlencode(p)}"
              with urllib.request.urlopen(u, timeout=30) as r:
                  return json.loads(r.read().decode()), r.headers.get("x-requests-remaining")
          N = lambda m: print("::notice::" + str(m).replace("\n", " ").replace("%", "%25")[:4000])
          evs, _ = get("/sports/icehockey_nhl/events")
          cbj = [e for e in evs if "Columbus" in e["home_team"] + e["away_team"] or "Florida" in e["home_team"] + e["away_team"]]
          N("EVENTS " + json.dumps([(e["id"], e["away_team"], e["home_team"], e["commence_time"]) for e in cbj]))
          for e in cbj:
              d, rem = get(f"/sports/icehockey_nhl/events/{e['id']}/odds", bookmakers="draftkings,fanduel",
                           markets="player_total_saves", oddsFormat="american")
              N(f"SAVES {e['id']} rem={rem} " + json.dumps([(b['key'], [(o['description'], o.get('point')) for m in b['markets'] for o in m['outcomes']]) for b in d.get('bookmakers', [])]))
              mk, rem = get(f"/sports/icehockey_nhl/events/{e['id']}/markets", bookmakers="draftkings,fanduel")
              N(f"MARKETS {e['id']} rem={rem} " + json.dumps([(b['key'], [m['key'] for m in b.get('markets', [])], [m.get('last_update') for m in b.get('markets', []) if 'save' in m['key']]) for b in mk.get('bookmakers', [])]))
          PY
