name: Probe bet links (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          key = os.environ["ODDS_API_KEY"]
          q = urllib.parse.urlencode({"apiKey": key, "regions": "us", "markets": "player_total_saves",
               "bookmakers": "draftkings,fanduel", "oddsFormat": "american", "includeLinks": "true", "includeSids": "true"})
          u = "https://api.the-odds-api.com/v4/sports/icehockey_nhl/events/ad530128f8a287b794e713643ee46757/odds?" + q
          with urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "probe"}), timeout=30) as r:
              d = json.loads(r.read().decode()); rem = r.headers.get("x-requests-remaining")
          print(f"::notice::REMAINING {rem}")
          for b in d.get("bookmakers", []):
              out = {"book": b["key"], "blink": b.get("link"), "bsid": b.get("sid")}
              for m in b.get("markets", []):
                  out["mlink"] = m.get("link"); out["msid"] = m.get("sid")
                  out["outcomes"] = [{k: o.get(k) for k in ("name", "description", "point", "link", "sid")} for o in m.get("outcomes", [])]
              s = json.dumps(out).replace(key, "KEY").replace("%", "%25")
              for i in range(0, len(s), 2400):
                  print(f"::notice::{b['key']}{i//2400} " + s[i:i+2400])
          PY
