name: Probe injury feeds (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe
        run: |
          python3 - <<'PY'
          import json, urllib.request
          def get(u):
              req = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode())
          try:
              d = get("https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/injuries")
              N=lambda m: print("::notice::"+str(m).replace("\n"," ").replace("%","%25")[:3000])
              N("ESPN keys "+str(list(d.keys())))
              teams = d.get("injuries", [])
              N("ESPN teams %d entries %d" % (len(teams), sum(len(t.get("injuries", [])) for t in teams)))
              for t in teams[:2]:
                  N("TEAM "+str(t.get("displayName"))+" "+json.dumps(t.get("injuries", [])[:1])[:2800])
          except Exception as e:
              print("::notice::ESPN FAILED "+str(e))
          try:
              d = get("https://api-web.nhle.com/v1/club-stats/WSH/now")
              print("::notice::CLUB keys "+str(list(d.keys())))
              print("::notice::SKATER "+json.dumps(d.get("skaters", [])[:1])[:1500])
          except Exception as e:
              print("::notice::CLUB FAILED "+str(e))
          try:
              d = get("https://api-web.nhle.com/v1/club-stats/WSH/20252026/2")
              sk = d.get("skaters", [])
              print("::notice::LAST "+str(len(sk))+" "+json.dumps(sk[:1])[:400])
          except Exception as e:
              print("::notice::LAST FAILED "+str(e))
          PY
