name: probe-lineup
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        shell: python
        run: |
          import json, urllib.request
          def get(u):
              try:
                  return json.load(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent":"Mozilla/5.0"}), timeout=20))
              except Exception as e:
                  return {"_err": str(e)}
          out = []
          sc = get("https://api-web.nhle.com/v1/score/now")
          for g in sc.get("games", []):
              gid = g["id"]; a = g["awayTeam"]["abbrev"]; h = g["homeTeam"]["abbrev"]
              line = f"{a}@{h} {gid} {g.get('gameState')} start={g.get('startTimeUTC')}"
              pbp = get(f"https://api-web.nhle.com/v1/gamecenter/{gid}/play-by-play")
              rs = pbp.get("rosterSpots", [])
              cnt = {}
              for r in rs:
                  cnt[r.get("teamId")] = cnt.get(r.get("teamId"), 0) + 1
              line += f" | pbp rosterSpots={len(rs)} {cnt}"
              if "LAK" in (a, h):
                  names = sorted(r["lastName"]["default"] for r in rs if r.get("teamId") == (g["homeTeam"]["id"] if h=="LAK" else g["awayTeam"]["id"]))
                  line += f" | LAK dressed: {','.join(names)}"
              bx = get(f"https://api-web.nhle.com/v1/gamecenter/{gid}/boxscore")
              pbs = bx.get("playerByGameStats", {})
              line += f" | box keys={list(bx.keys())[:12]} pbs_home={sum(len(v) for v in pbs.get('homeTeam',{}).values()) if pbs else 0}"
              ld = get(f"https://api-web.nhle.com/v1/gamecenter/{gid}/landing")
              line += f" | landing keys={list(ld.keys())}"
              rr = get(f"https://api-web.nhle.com/v1/gamecenter/{gid}/right-rail")
              line += f" | rail keys={list(rr.keys())}"
              out.append(line)
          # also the next day's games: does pbp roster exist well ahead?
          txt = "\n".join(out)
          for i in range(0, len(txt), 2400):
              print("::notice::" + txt[i:i+2400].replace("\n", " %0A "))
