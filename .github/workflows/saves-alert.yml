name: Goalie saves alerts

on:
  schedule:
    # Every 20 minutes, 10:00 AM to 9:59 PM Eastern (times below are UTC).
    - cron: "*/20 14-23 * * *"
    - cron: "*/20 0-1 * * *"
  workflow_dispatch:
    inputs:
      test_push:
        description: "Send a test notification instead of checking lines"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: saves-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main  # always start from the latest saved data, not the trigger-time copy

      - name: Check for new saves lines
        run: python3 saves_alert.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_SILENT: ${{ vars.TELEGRAM_SILENT }}
          TEAMS: ${{ vars.TEAMS }}
          SHOT_THRESHOLD: ${{ vars.SHOT_THRESHOLD }}
          TARGET_SAVES: ${{ vars.TARGET_SAVES }}
          RECHECK_MINUTES: ${{ vars.RECHECK_MINUTES }}
          RECHECK_WINDOW_HOURS: ${{ vars.RECHECK_WINDOW_HOURS }}
          RECHECK_RESERVE: ${{ vars.RECHECK_RESERVE }}
          TEST_PUSH: ${{ inputs.test_push }}

      - name: Save which games have already alerted
        if: ${{ !inputs.test_push }}
        run: |
          git config user.name "saves-alert-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json picks.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update alert state"
            git push
          fi
